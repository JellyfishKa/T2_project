services:
  postgres:
    image: postgres:16-alpine
    container_name: t2_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-t2}
    ports:
      - "${POSTGRES_PORT_BIND:-127.0.0.1:5432:5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: t2_redis
    restart: always
    ports:
      - "${REDIS_PORT_BIND:-127.0.0.1:6379:6379}"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: t2_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./src/models:/app/src/models:ro
    environment:
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-t2}
      - QWEN_MODEL_ID=${QWEN_MODEL_ID:-qwen2-0_5b-instruct-q4_k_m.gguf}
      - LLAMA_MODEL_ID=${LLAMA_MODEL_ID:-Llama-3.2-1B-Instruct-Q4_K_M.gguf}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SECURITY_ENABLE_API_KEY_AUTH=${SECURITY_ENABLE_API_KEY_AUTH:-false}
      - SECURITY_API_KEY=${SECURITY_API_KEY:-}
      - SECURITY_ADMIN_API_KEY=${SECURITY_ADMIN_API_KEY:-}
      - SECURITY_ALLOW_BULK_LOCATION_DELETE=${SECURITY_ALLOW_BULK_LOCATION_DELETE:-false}
      - SECURITY_ALLOW_BENCHMARK_RUN=${SECURITY_ALLOW_BENCHMARK_RUN:-false}
      - PYTHONPATH=/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: t2_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: